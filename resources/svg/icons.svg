<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <!--
    Microweber Icon Sprite
    Usage: <svg><use href="/resources/svg/icons.svg#icon-name"/></svg>

    Note: This sprite contains custom Microweber icons that are not available
    in Heroicons. For standard icons, use heroicon-o-* or heroicon-s-* directly.

    Icons defined here:
    - mw-save: Save/floppy disk icon
    - mw-cash: Cash/money icon
    - mw-payments: Credit card/payment icon
    - mw-shipping: Shipping/truck icon
    - mw-settings: Cog/settings icon
    - mw-coupon: Ticket/coupon icon
    - mw-offers: Tag/offer icon
    - mw-dots-menu: Three dots menu icon
    -->

    <!-- mw-save: Save/Floppy Disk -->
    <symbol id="mw-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0111.186 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 7.5h9M7.5 12h9"/>
    </symbol>

    <!-- mw-cash: Cash/Money -->
    <symbol id="mw-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-6h6"/>
        <circle cx="12" cy="12" r="10"/>
    </symbol>

    <!-- mw-payments: Credit Card/Payment -->
    <symbol id="mw-payments" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2.25" y="4.5" width="19.5" height="15" rx="1.5" stroke="currentColor"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 10.5h19.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 14.25h3"/>
    </symbol>

