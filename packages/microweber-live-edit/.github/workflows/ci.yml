name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish --no-check-lock
      - name: Install dependencies (from Packagist)
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Autoload check
        run: php -r "require 'vendor/autoload.php'; echo 'autoload OK' . PHP_EOL;"
      - name: Tests (+ coverage, best-effort)
        continue-on-error: true
        run: |
          if [ -x vendor/bin/phpunit ] && { [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; }; then
            vendor/bin/phpunit --coverage-clover=coverage.clover --coverage-text || vendor/bin/phpunit
          else
            echo "No standalone phpunit suite."
          fi
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage.clover
          if-no-files-found: ignore
