; PHP per-directory configuration (PHP-FPM / CGI SAPI).
;
; PCRE engine ceilings. Microweber's template/HTML parsing and Livewire's
; debug-mode SupportMultipleRootElementDetection hook run preg_* over large
; renders (e.g. the live-edit template-settings sidebar: ~1.5MB output, 81
; inline scripts). The default 1M backtrack limit makes preg_replace() return
; NULL silently, which then crashes DOMDocument::loadHTML(""). These were
; previously set at runtime in public/index.php; moved here so no application
; code mutates php.ini. Only raises regex-engine ceilings — production-safe.
pcre.backtrack_limit = 100000000
pcre.recursion_limit = 100000000
