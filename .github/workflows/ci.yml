name: PHP Tests (Pest + PHPUnit)
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main_phpunit:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-versions: ['8.2','8.3']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, dom, fileinfo, mysql, gd, curl, zip, sqlite, xml, intl, bcmath, json, zlib, openssl, iconv
        coverage: xdebug
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-
    - name: Cache vendor directory
      id: vendor-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-
    - name: Install Composer dependencies
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
    - name: Regenerate autoload (on cache hit)
      if: steps.vendor-cache.outputs.cache-hit == 'true'
      run: composer dump-autoload --optimize
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ./package-lock.json
    - run: npm ci
    - run: npm run build

    - name: Copy env
      run: |
        rm -f .env
        cp .env.dusk .env
        rm -f .env.testing
        rm -f .env.dusk
        sed -i 's/APP_ENV=local/APP_ENV=testing/g' .env
        sed -i 's/APP_ENV=production/APP_ENV=testing/g' .env

    - name: List all artisan commands
      run: php artisan list
    - name: Run Tests (Pest + PHPUnit)
      run: vendor/bin/pest --configuration phpunit.xml
    - name: Run Pest Module Suites
      run: vendor/bin/pest --configuration pest.xml --testsuite=Unit,Feature
    - name: Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: tests/Browser/screenshots
    - name: Upload Console Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: console
        path: tests/Browser/console
    - name: Upload Laravel Storage Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: storage-logs
        path: storage/logs
    - name: Upload Laravel config
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: config
        path: config
