name: Dusk Apache Big theme tests
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dusk_apache_big_theme:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-versions: [ '8.4' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          DEBUG: true
          APP_ENV: "testing"
      - uses: ./.github/actions/setup-php
        with:
          php_version: ${{ matrix.php-versions }}
      - name: Install Composer dependencies
        run: composer install --dev
      - name: Npm install
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - run: npm install
      - run: npm run build

      - name: Cleanup old theme files
        run: |
          rm -rf ./userfiles/templates/big

      - name: Get Theme from Github
        uses: actions/checkout@v4
        with:
          repository: microweber-templates/big-free
          path: ./userfiles/templates/big

      - name: Remove screenshot layout test
        run: |
          rm -f userfiles/templates/big/src/tests/Browser/BigScreenshotLayoutsTest.php

      - name: Setup Apache
        uses: thunder/apache-shiva-php-action@v1
        with:
          php-version: '8.4'
          # DocumentRoot must be Laravel's public/ (index.php + .htaccess);
          # the repo root made Apache 404 every route and time out the tests.
          site-directory: /home/runner/work/microweber/microweber/public
          # Defaults to 8888
          http-port: 8000
      # Cached vendor/ doesn't include the platform-specific
      # chromedriver binary — install it ahead of time so the Dusk
      # test step doesn't 100% fail with "Invalid path to Chromedriver".
      - name: Install Chromedriver
        run: php artisan dusk:chrome-driver --detect
      # `php artisan dusk` swaps in the committed .env.dusk
      # (DB_DATABASE=storage/database.sqlite). On CI that file is absent and
      # DuskTestCase's in-process auto-install does not reliably populate it
      # under the Dusk runtime, so install the schema explicitly here into the
      # exact file Dusk uses (touch first — the SQLite connector needs the file
      # to exist — then microweber:install builds tables + admin + content).
      - name: Create and install the Dusk sqlite database
        run: |
          # Install into the exact env Dusk uses. .env.dusk points DB at
          # storage/database.sqlite and leaves CACHE_STORE unset; copying it
          # over .env (and forcing the array cache for the install itself)
          # avoids the .env.example CACHE_STORE=database "no such table: cache"
          # fatal that aborts the installer before the cache table exists.
          cp .env.dusk .env
          mkdir -p storage
          touch storage/database.sqlite
          CACHE_STORE=array php artisan microweber:install \
            --db-driver=sqlite \
            --db-name=storage/database.sqlite \
            --db-prefix= \
            --email=admin@admin.com \
            --username=admin \
            --password=admin \
            --default-content=default \
            --template=bootstrap \
            --no-interaction
      - name: Run Dusk Tests
        run: |
          chmod -R 0755 vendor/laravel/dusk/bin/
          composer test-dusk
      # Artifact names include the PHP version + workflow run-attempt
      # so re-runs don't collide with earlier uploads (v4 errors on
      # duplicate names). Screenshots are the primary signal for
      # blank-thumbnail-style visual regressions — keeping them
      # uploadable on every failure is the point of this step.
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-bigtheme-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: tests/Browser/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-bigtheme-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: tests/Browser/console
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Laravel Storage Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storage-logs-bigtheme-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: storage/logs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Laravel config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-bigtheme-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: config
          if-no-files-found: warn
          retention-days: 14
