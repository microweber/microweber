name: Dusk
on: [ push ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dusk:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-versions: [ '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, dom, fileinfo, mysql, gd, curl, zip, sqlite, xml, intl, bcmath, json, zlib, openssl, iconv
          coverage: xdebug
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-
      - name: Cache vendor directory
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-
      - name: Install Composer dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
      - name: Regenerate autoload (on cache hit)
        if: steps.vendor-cache.outputs.cache-hit == 'true'
        run: composer dump-autoload --optimize
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - run: npm ci
      - run: npm run build
      - name: List all artisan commands
        run: php artisan list
      - name: Run PHPUnit
        run: php artisan test
      - name: Remove screenshot layout test
        run: |
          rm -f userfiles/templates/big/src/tests/Browser/BigScreenshotLayoutsTest.php
      - name: Clear bootstrap cache
        run: php artisan optimize:clear
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Set env to testing
        run: |
          sed -i 's/APP_ENV=local/APP_ENV=testing/g' .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/g' .env
      - name: Run Laravel Server
        #run: php artisan serve-test --env=testing > /dev/null 2>&1 &
        #run: APP_ENV=testing && php -d variables_order=EGPCS -S 127.0.0.1:8000 > /dev/null 2>&1 &
       # run: APP_ENV=testing && php -d variables_order=EGPCS -S 127.0.0.1:8000 > /home/runner/work/microweber/microweber/storage/logs/serve.log 2>&1 &
        run: APP_ENV=testing && php artisan serve-test-code-coverage --ansi --env=testing --no-interaction --quiet &
      # Phase-9 discrete-check: run the palette group first so a color
      # regression shows up as a separate red step (not buried inside the
      # 250+ test Browser suite). `--group=color-palettes` targets every
      # LiveEditColorPalette*Test tagged with `#[Group('color-palettes')]`
      # and nothing else.
      #
      # A failure here is captured by the `if: failure()` upload steps
      # below — no palette-specific upload needed. Those uploads are
      # load-bearing for blank-swatch-style regressions (the Dusk
      # screenshot is the only signal that distinguishes "pack didn't
      # apply" from "pack applied with the wrong colors"), so do NOT
      # remove or narrow them when editing this workflow.
      - name: Run Dusk Tests (Color palettes)
        run: |
          chmod -R 0755 vendor/laravel/dusk/bin/
          php artisan dusk --group=color-palettes
      - name: Run Dusk Tests
        run: |
          chmod -R 0755 vendor/laravel/dusk/bin/
          php artisan dusk --exclude-group=color-palettes
      # Artifact names include the PHP version + workflow run-attempt
      # so re-runs don't collide with earlier uploads (v4 errors on
      # duplicate names). Screenshots are the primary signal for
      # blank-thumbnail-style visual regressions — keeping them
      # uploadable on every failure is the point of this step.
      #
      # `if: failure()` fires whenever *any* prior step failed, so this
      # covers BOTH the `Run Dusk Tests (Color palettes)` step (added in
      # Phase-9) and the general `Run Dusk Tests` step. The Phase-9
      # task intentionally reuses these uploads instead of introducing
      # palette-specific ones — the screenshot/console/log corpus is
      # shared on disk (`tests/Browser/screenshots`, etc.), so a single
      # zip per run captures both flows.
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: tests/Browser/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: tests/Browser/console
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Laravel Storage Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storage-logs-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: storage/logs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Laravel config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: config
          if-no-files-found: warn
          retention-days: 14
