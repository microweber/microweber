name: Dusk Apache
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dusk_apache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-versions: [ '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          DEBUG: true
          APP_ENV: "testing"
      - uses: ./.github/actions/setup-php
        with:
          php_version: ${{ matrix.php-versions }}
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Copy .env.example to .env
        run: cp .env.example .env
      - name: Set env to testing
        run: |
          sed -i 's/APP_ENV=local/APP_ENV=testing/g' .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/g' .env
      - name: Npm install
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - run: npm install
      - run: npm run build
      - name: Remove screenshot layout test
        run: |
          rm -f userfiles/templates/big/src/tests/Browser/BigScreenshotLayoutsTest.php
      - name: Setup Apache
        uses: thunder/apache-shiva-php-action@v1
        with:
          php-version: '8.3'
          site-directory: /home/runner/work/microweber/microweber/
          # Defaults to 8888
          http-port: 8000
      - name: Run Dusk Tests
        run: |
          chmod -R 0755 vendor/laravel/dusk/bin/
          composer test-dusk
      # Artifact names include the PHP version + workflow run-attempt
      # so re-runs don't collide with earlier uploads (v4 errors on
      # duplicate names). Screenshots are the primary signal for
      # blank-thumbnail-style visual regressions — keeping them
      # uploadable on every failure is the point of this step.
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-apache-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: tests/Browser/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-apache-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: tests/Browser/console
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Laravel Storage Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storage-logs-apache-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: storage/logs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Laravel config
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-apache-php${{ matrix.php-versions }}-attempt${{ github.run_attempt }}
          path: config
          if-no-files-found: warn
          retention-days: 14
