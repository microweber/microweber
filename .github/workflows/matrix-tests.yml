name: Matrix Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11']
        include:
          # Experimental builds - PHP 8.2 support
          - php: '8.2'
            laravel: '11'
            experimental: true
          # Future builds - Laravel 12 (when released)
          - php: '8.3'
            laravel: '12'
            experimental: true
          - php: '8.4'
            laravel: '12'
            experimental: true
          # Laravel 10 compatibility (may require dependency adjustments)
          - php: '8.2'
            laravel: '10'
            experimental: true
          - php: '8.3'
            laravel: '10'
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, mysql, gd, curl, zip, sqlite, xml, intl, bcmath, json, zlib, openssl, iconv, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-downloads-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-downloads-

      - name: Cache vendor directory
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-vendor-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-vendor-

      - name: Setup Laravel ${{ matrix.laravel }} Dependencies
        run: |
          if [ "${{ matrix.laravel }}" != "11" ]; then
            echo "Adjusting for Laravel ${{ matrix.laravel }}..."
            # Update composer.json to use specified Laravel version
            sed -i 's/"laravel\/framework": "\^11"/"laravel\/framework": "^${{ matrix.laravel }}"/' composer.json
            # Check PHP compatibility
            if [ "${{ matrix.php }}" = "8.2" ] && [ "${{ matrix.laravel }}" = "11" ]; then
              # Laravel 11 requires PHP 8.2, but our composer.json requires PHP ^8.3
              # Allow PHP 8.2 temporarily for this test
              sed -i 's/"php": "\^8.3"/"php": "^8.2"/' composer.json
            fi
          fi

      - name: Install Composer dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
      - name: Regenerate autoload (on cache hit)
        if: steps.vendor-cache.outputs.cache-hit == 'true'
        run: composer dump-autoload --optimize

      - name: Show Laravel Version
        run: php artisan --version

      - name: Show PHP Version
        run: php -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare Environment
        run: |
          rm -f .env
          cp .env.example .env
          sed -i 's/APP_ENV=local/APP_ENV=testing/g' .env
          sed -i 's/APP_ENV=production/APP_ENV=testing/g' .env
          php artisan key:generate --ansi
          touch database/database.sqlite

      - name: Create test results directory
        run: mkdir -p build/test-results

      - name: Run Tests (Pest + PHPUnit) with Coverage
        run: vendor/bin/pest --configuration phpunit.xml --coverage-clover clover.xml --log-junit build/test-results/phpunit.xml 2>&1 | tee build/test-results/pest-output.txt

      - name: Run Pest Module Suites
        run: vendor/bin/pest --configuration pest.xml --testsuite=Unit,Feature --coverage-text --min-coverage=0 --log-junit build/test-results/pest-modules.xml 2>&1 | tee build/test-results/pest-modules-output.txt

      - name: Upload coverage to Codecov
        if: always() && matrix.php == '8.3' && matrix.laravel == '11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clover.xml
          flags: matrix-tests
          name: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}
          fail_ci_if_error: false

      - name: Cache PHPStan results
        uses: actions/cache@v4
        with:
          path: build/phpstan
          key: phpstan-php${{ matrix.php }}-${{ hashFiles('phpstan.neon.dist', 'composer.lock') }}
          restore-keys: |
            phpstan-php${{ matrix.php }}-

      - name: Run Static Analysis (PHPStan)
        run: |
          if [ -f "phpstan.neon.dist" ] || [ -f "phpstan.neon" ]; then
            composer require --dev phpstan/phpstan --no-interaction --quiet || true
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G || true
          fi

      - name: Generate Test Failure Summary
        if: failure()
        run: |
          mkdir -p build/test-results
          echo "# Test Failure Summary" > build/test-results/summary.md
          echo "" >> build/test-results/summary.md
          echo "**PHP:** ${{ matrix.php }} | **Laravel:** ${{ matrix.laravel }}" >> build/test-results/summary.md
          echo "**Run:** ${{ github.run_id }} | **SHA:** ${{ github.sha }}" >> build/test-results/summary.md
          echo "" >> build/test-results/summary.md

          # Extract failures from JUnit XML if available
          for xml in build/test-results/phpunit.xml build/test-results/pest-modules.xml; do
            if [ -f "$xml" ]; then
              failures=$(grep -c '<failure' "$xml" 2>/dev/null || echo "0")
              errors=$(grep -c '<error' "$xml" 2>/dev/null || echo "0")
              tests=$(grep -oP 'tests="\K[0-9]+' "$xml" | head -1 || echo "?")
              echo "## $(basename "$xml")" >> build/test-results/summary.md
              echo "Tests: $tests | Failures: $failures | Errors: $errors" >> build/test-results/summary.md
              echo "" >> build/test-results/summary.md

              # List failing test names
              if [ "$failures" -gt 0 ] || [ "$errors" -gt 0 ]; then
                echo "### Failed Tests" >> build/test-results/summary.md
                echo '```' >> build/test-results/summary.md
                grep -oP 'name="\K[^"]+' "$xml" | head -50 >> build/test-results/summary.md 2>/dev/null || true
                echo '```' >> build/test-results/summary.md
                echo "" >> build/test-results/summary.md

                echo "### Failure Messages" >> build/test-results/summary.md
                echo '```' >> build/test-results/summary.md
                grep -A2 '<failure\|<error' "$xml" | head -100 >> build/test-results/summary.md 2>/dev/null || true
                echo '```' >> build/test-results/summary.md
              fi
            fi
          done

          # Append Laravel log tail if present
          if [ -f storage/logs/laravel.log ]; then
            echo "" >> build/test-results/summary.md
            echo "## Laravel Log (last 100 lines)" >> build/test-results/summary.md
            echo '```' >> build/test-results/summary.md
            tail -100 storage/logs/laravel.log >> build/test-results/summary.md
            echo '```' >> build/test-results/summary.md
          fi

      - name: Upload Test Failure Summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-summary-php${{ matrix.php }}-laravel${{ matrix.laravel }}
          path: |
            build/test-results/summary.md
            build/test-results/phpunit.xml
            build/test-results/pest-modules.xml
            build/test-results/pest-output.txt
            build/test-results/pest-modules-output.txt
          retention-days: 7

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-php${{ matrix.php }}-laravel${{ matrix.laravel }}
          path: |
            storage/logs/*.log
            tests/Browser/screenshots/*.png
            tests/Browser/console/*.log
          retention-days: 5

  # Summary job that depends on matrix tests
  matrix-test-summary:
    name: Matrix Test Summary
    runs-on: ubuntu-latest
    needs: matrix-tests
    if: always()
    steps:
      - name: Download all failure summaries
        if: needs.matrix-tests.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: test-failure-summary-*
          path: failure-summaries
          merge-multiple: false

      - name: Aggregate failure summaries
        if: needs.matrix-tests.result == 'failure'
        run: |
          echo "# Aggregated Test Failure Report" > aggregated-summary.md
          echo "" >> aggregated-summary.md
          echo "**Workflow:** ${{ github.workflow }}" >> aggregated-summary.md
          echo "**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> aggregated-summary.md
          echo "" >> aggregated-summary.md

          if [ -d "failure-summaries" ]; then
            for dir in failure-summaries/test-failure-summary-*/; do
              if [ -f "$dir/summary.md" ]; then
                combo=$(basename "$dir" | sed 's/test-failure-summary-//')
                echo "---" >> aggregated-summary.md
                echo "## $combo" >> aggregated-summary.md
                cat "$dir/summary.md" >> aggregated-summary.md
                echo "" >> aggregated-summary.md
              fi
            done
          else
            echo "No failure summaries found." >> aggregated-summary.md
          fi

          cat aggregated-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload aggregated failure report
        if: needs.matrix-tests.result == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-test-failure-report
          path: aggregated-summary.md
          retention-days: 14

      - name: Check Matrix Results
        run: |
          echo "Matrix test results: ${{ needs.matrix-tests.result }}"
          echo "Note: Some combinations may be marked as experimental"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Matrix Test Results');
            });
            
            const output = `### Matrix Test Results
            
            ✅ **Core Combinations:**
            - PHP 8.3 + Laravel 11
            - PHP 8.4 + Laravel 11
            
            🧪 **Experimental Combinations:**
            - PHP 8.2 + Laravel 10/11
            - Laravel 12 (future compatibility)
            
            *Note: Experimental combinations may fail and are allowed to fail.*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
