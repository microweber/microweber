name: monorepo-split

on:
  push:
#    tags: '*'

jobs:
  split-monorepo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - microweber-filament-theme
    steps:
      - uses: actions/checkout@v4
      # Split the package subtree to its own repo's `filament` branch on every
      # push. No tag step here: the repo currently carries no git tags, so
      # WyriHaximus/github-action-get-previous-tag errored ("No fallback tag was
      # provided and no tag was found") and failed the whole job. danharrin's
      # action's `tag` input is optional (release-tag propagation only), so a
      # branch split doesn't need it. Tagged releases, if wanted later, belong in
      # a separate `on: push: tags` job.
      - name: Monorepo Split of ${{ matrix.package }}
        uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'microweber-packages'
          repository_name: '${{ matrix.package }}'
          branch: filament
          user_name: 'mw-bot'
          user_email: 'bot@microweber.com'
