name: PHP Coverage Tests With Xdebug

on:
  push:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-coveralls:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-versions: ['8.3']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, dom, fileinfo, mysql, gd, curl, zip, sqlite, xml, intl, bcmath, json, zlib, openssl, iconv
        coverage: xdebug
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-
    - name: Cache vendor directory
      id: vendor-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-
    - name: Install Composer dependencies
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
    - name: Regenerate autoload (on cache hit)
      if: steps.vendor-cache.outputs.cache-hit == 'true'
      run: composer dump-autoload --optimize
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ./package-lock.json
    - run: npm ci
    - run: npm run build
    - name: Copy env
      run: |
        rm -f .env
        cp .env.dusk .env
        rm -f .env.testing
        rm -f .env.dusk
        sed -i 's/APP_ENV=local/APP_ENV=testing/g' .env
        sed -i 's/APP_ENV=production/APP_ENV=testing/g' .env

    - name: List all artisan commands
      run: php artisan list
    - name: Run PHPUnit Coverage with Xdebug
      run: composer test-coverage
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        flag-name: run-${{ join(matrix.*, '-') }}
        parallel: true
        files: clover.xml

  dusk-coveralls:
    needs: main-coveralls
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php-versions: ['8.3']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, dom, fileinfo, mysql, gd, curl, zip, sqlite, xml, intl, bcmath, json, zlib, openssl, iconv
        coverage: xdebug
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-composer-downloads-
    - name: Cache vendor directory
      id: vendor-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-vendor-
    - name: Install Composer dependencies
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
    - name: Regenerate autoload (on cache hit)
      if: steps.vendor-cache.outputs.cache-hit == 'true'
      run: composer dump-autoload --optimize
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ./package-lock.json
    - run: npm ci
    - run: npm run build
    - name: List all artisan commands
      run: php artisan list
    - name: Replace requireEnv in vite.config.js
      run: |
        sed -i 's/requireEnv: true,/requireEnv: false,/' vite.config.js
    - name: Remove screenshot layout test
      run: |
        rm -f userfiles/templates/big/src/tests/Browser/BigScreenshotLayoutsTest.php
    - run: npm install -g istanbul
    - run: npm install -g istanbul-combine
    - run: npm install -g istanbul-merge
    - run: npm install -g nyc
    - run: npm install
    - run: npm run build
    - name: Run Laravel Server
      run: APP_ENV=testing && php artisan serve-test-code-coverage --ansi --env=testing --no-interaction --quiet &
    - name: Run Dusk Tests
      run: |
        chmod -R 0755 vendor/laravel/dusk/bin/
        composer test-dusk
    - name: Combine JS coverage
      run: |
        nyc merge tests/coverages/js tests/coverages/coverage.raw.json
        istanbul report --dir tests/coverages/js-report --include tests/coverages/coverage.raw.json lcov
    - name: Combine clover file
      working-directory: ./tests
      run: |
        php combine_xdebug.php
    - name: Coveralls Dusk Upload
      uses: coverallsapp/github-action@v2
      with:
        flag-name: run-${{ join(matrix.*, '-') }}
        parallel: true
        files: tests/coverages/dusk-clover.xml tests/coverages/js-report/lcov.info
    - name: Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: tests/Browser/screenshots
    - name: Upload Console Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: console
        path: tests/Browser/console
    - name: Upload Laravel Storage Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: storage-logs
        path: storage/logs
    - name: Upload Laravel config
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: config
        path: config


  finish:
    needs: dusk-coveralls
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "true"
